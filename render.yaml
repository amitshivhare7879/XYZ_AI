services:
  - type: web
    name: xyz-ai-school-erp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn 05_xyz_ai.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_LOCAL_SQLITE_FALLBACK
        value: "false"
      - key: JWT_SECRET_KEY
        value: "xyz-ai-school-erp-super-secret-key-2026"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
