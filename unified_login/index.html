<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYZ AI — Unified School ERP Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070B14; color: #F3F4F6; }
    h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-indigo { box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.25); }
    .gradient-border { background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(168, 85, 247, 0.2)); }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-center relative overflow-y-auto">

  <!-- Subtle ambient background gradients -->
  <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-violet-600/15 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- School & Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 font-heading font-bold text-2xl text-white shadow-xl shadow-indigo-500/20 mb-4 ring-4 ring-indigo-500/20">
        XYZ
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight font-heading">XYZ AI School ERP</h1>
      <p class="text-sm text-gray-400 mt-1">Single Sign-On Authentication Gateway</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl glow-indigo border border-gray-800/80">
      
      <div class="mb-6">
        <h2 class="text-xl font-bold text-white font-heading">Sign In</h2>
        <p class="text-xs text-gray-400 mt-1">Your role will be automatically identified from your verified token.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">School Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-envelope text-sm"></i>
            </div>
            <input type="email" id="emailInput" required placeholder="name@school.edu or gmail.com" 
              class="w-full pl-10 pr-4 py-3 bg-gray-900/90 border border-gray-700 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
              value="amit.patel@gmail.com" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input type="password" id="passwordInput" required placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 bg-gray-900/90 border border-gray-700 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
              value="password123" />
          </div>
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all flex items-center justify-center space-x-2">
          <span>Authenticate & Launch Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Status / Feedback Message -->
      <div id="statusBox" class="mt-4 hidden p-3 rounded-xl text-xs flex items-center space-x-2"></div>

      <!-- Quick Demo Role Switcher -->
      <div class="mt-8 pt-6 border-t border-gray-800">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 text-center">Quick Demo Personas</p>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button onclick="fillAndLogin('amit.patel@gmail.com', 'parent')" class="p-2.5 rounded-lg bg-gray-800/60 hover:bg-indigo-950/60 border border-gray-700/60 hover:border-indigo-500/50 text-left transition-all flex items-center space-x-2">
            <i class="fa-solid fa-hands-holding-child text-indigo-400"></i>
            <div>
              <p class="font-medium text-white">Amit Patel</p>
              <p class="text-[10px] text-gray-400">Parent (Grade 10-A)</p>
            </div>
          </button>
          <button onclick="fillAndLogin('rahul.patel@student.school.edu', 'student')" class="p-2.5 rounded-lg bg-gray-800/60 hover:bg-indigo-950/60 border border-gray-700/60 hover:border-indigo-500/50 text-left transition-all flex items-center space-x-2">
            <i class="fa-solid fa-user-graduate text-emerald-400"></i>
            <div>
              <p class="font-medium text-white">Rahul Patel</p>
              <p class="text-[10px] text-gray-400">Student (Grade 10-A)</p>
            </div>
          </button>
          <button onclick="fillAndLogin('anjali.verma@school.edu', 'teacher')" class="p-2.5 rounded-lg bg-gray-800/60 hover:bg-indigo-950/60 border border-gray-700/60 hover:border-indigo-500/50 text-left transition-all flex items-center space-x-2">
            <i class="fa-solid fa-chalkboard-user text-amber-400"></i>
            <div>
              <p class="font-medium text-white">Anjali Verma</p>
              <p class="text-[10px] text-gray-400">Teacher (10-A Mentor)</p>
            </div>
          </button>
          <button onclick="fillAndLogin('principal@school.edu', 'principal')" class="p-2.5 rounded-lg bg-gray-800/60 hover:bg-indigo-950/60 border border-gray-700/60 hover:border-indigo-500/50 text-left transition-all flex items-center space-x-2">
            <i class="fa-solid fa-building-columns text-purple-400"></i>
            <div>
              <p class="font-medium text-white">Dr. Rajesh Sharma</p>
              <p class="text-[10px] text-gray-400">Principal (Leadership)</p>
            </div>
          </button>
        </div>
      </div>

    </div>

    <!-- Security Guarantee Badge -->
    <div class="mt-6 text-center text-xs text-gray-400 flex items-center justify-center space-x-2">
      <i class="fa-solid fa-shield-halved text-indigo-400"></i>
      <span>Protected by Cryptographic JWT & Supabase RLS</span>
    </div>

  </div>

  <script>
    const isSingleOrigin = window.location.port === "7860" || window.location.port === "8000" || window.location.hostname.includes("huggingface.co") || window.location.hostname.includes("hf.space") || window.location.port === "";
    const API_BASE = isSingleOrigin ? window.location.origin : "http://localhost:8000";
    
    // Deployment Port Map for Local Dev / Single-Origin Path Map for Hugging Face Spaces
    const PORTAL_ROUTES = {
      "student": isSingleOrigin ? "/student" : "http://localhost:3001",
      "parent": isSingleOrigin ? "/parent" : "http://localhost:3002",
      "teacher": isSingleOrigin ? "/staff" : "http://localhost:3003",
      "principal": isSingleOrigin ? "/management" : "http://localhost:3004"
    };

    function showStatus(text, isError = false) {
      const box = document.getElementById("statusBox");
      box.className = `mt-4 p-3 rounded-xl text-xs flex items-center space-x-2 ${
        isError ? "bg-rose-950/60 border border-rose-500/50 text-rose-300" : "bg-emerald-950/60 border border-emerald-500/50 text-emerald-300"
      }`;
      box.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${text}</span>`;
      box.classList.remove("hidden");
    }

    async function handleLogin(email, password) {
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        let data;
        try {
          data = await res.json();
        } catch (jsonErr) {
          throw new Error("Received unexpected server response. Please try again.");
        }

        if (!res.ok) {
          throw new Error(data.detail || "Authentication failed");
        }

        // Save verified session token and user profile
        localStorage.setItem("xyz_token", data.access_token);
        localStorage.setItem("xyz_user", JSON.stringify(data.user));

        const role = data.user.role;
        const targetUrl = PORTAL_ROUTES[role] || (isSingleOrigin ? "/parent" : "http://localhost:3002");
        
        showStatus(`Authenticated as ${data.user.name} (${role.toUpperCase()}). Redirecting...`);
        
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 600);

      } catch (err) {
        showStatus(err.message, true);
        btn.disabled = false;
        btn.innerHTML = `<span>Authenticate & Launch Portal</span><i class="fa-solid fa-arrow-right text-xs ml-2"></i>`;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      handleLogin(email, password);
    });

    function fillAndLogin(email, role) {
      document.getElementById("emailInput").value = email;
      document.getElementById("passwordInput").value = "password123";
      handleLogin(email, "password123");
    }
  </script>
</body>
</html>
