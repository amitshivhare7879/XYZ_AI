<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYZ AI — Unified School ERP Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      zoom: 0.65;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%),
                  #070B14;
      color: #F3F4F6;
    }
    h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    .glass-card {
      background: rgba(13, 19, 36, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .persona-card {
      background: rgba(18, 26, 48, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .persona-card:hover {
      transform: translateY(-2px);
      background: rgba(30, 41, 75, 0.8);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.25);
    }
    .glow-indigo { box-shadow: 0 0 45px -5px rgba(99, 102, 241, 0.25); }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    .floating-badge { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-center relative overflow-y-auto selection:bg-indigo-500 selection:text-white">

  <!-- Ambient background lighting orbs -->
  <div class="fixed top-[-15%] left-[-15%] w-[600px] h-[600px] bg-gradient-to-br from-indigo-600/20 to-purple-600/10 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="fixed bottom-[-15%] right-[-15%] w-[600px] h-[600px] bg-gradient-to-tl from-purple-600/20 to-cyan-600/10 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- School & Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 font-heading font-extrabold text-2xl text-white shadow-2xl shadow-indigo-500/30 mb-4 ring-4 ring-indigo-500/20 floating-badge">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-100 to-purple-200 tracking-tight font-heading">XYZ AI School ERP</h1>
      <p class="text-xs text-indigo-300/80 mt-1 font-medium tracking-wide uppercase">Unified Single Sign-On Gateway</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-8 shadow-2xl glow-indigo border border-white/10">
      
      <div class="mb-6">
        <h2 class="text-xl font-bold text-white font-heading tracking-wide">Sign In</h2>
        <p class="text-xs text-gray-400 mt-1">Select a role or enter credentials to launch your portal.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">School Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-indigo-400">
              <i class="fa-solid fa-envelope text-sm"></i>
            </div>
            <input type="email" id="emailInput" required placeholder="name@school.edu or gmail.com" 
              class="w-full pl-10 pr-4 py-3 bg-[#0A0F1D] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all placeholder:text-gray-500"
              value="amit.patel@gmail.com" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-indigo-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input type="password" id="passwordInput" required placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 bg-[#0A0F1D] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all placeholder:text-gray-500"
              value="password123" />
          </div>
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-500 hover:from-indigo-400 hover:to-pink-400 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 hover:scale-[1.01] transition-all flex items-center justify-center space-x-2">
          <span>Authenticate & Launch Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Status / Feedback Message -->
      <div id="statusBox" class="mt-4 hidden p-3 rounded-xl text-xs flex items-center space-x-2"></div>

      <!-- Quick Demo Role Switcher -->
      <div class="mt-8 pt-6 border-t border-white/10">
        <p class="text-[11px] font-semibold text-indigo-300 uppercase tracking-wider mb-3 text-center">Quick Demo Personas</p>
        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <button onclick="fillAndLogin('amit.patel@gmail.com', 'parent')" class="persona-card p-3 rounded-xl text-left flex items-center space-x-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition">
              <i class="fa-solid fa-hands-holding-child text-xs"></i>
            </div>
            <div>
              <p class="font-semibold text-white group-hover:text-indigo-300 transition">Amit Patel</p>
              <p class="text-[10px] text-gray-400">Parent Portal</p>
            </div>
          </button>

          <button onclick="fillAndLogin('rahul.patel@student.school.edu', 'student')" class="persona-card p-3 rounded-xl text-left flex items-center space-x-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center group-hover:bg-cyan-500 group-hover:text-black transition">
              <i class="fa-solid fa-user-graduate text-xs"></i>
            </div>
            <div>
              <p class="font-semibold text-white group-hover:text-cyan-300 transition">Rahul Patel</p>
              <p class="text-[10px] text-gray-400">Student Portal</p>
            </div>
          </button>

          <button onclick="fillAndLogin('anjali.verma@school.edu', 'teacher')" class="persona-card p-3 rounded-xl text-left flex items-center space-x-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-black transition">
              <i class="fa-solid fa-chalkboard-user text-xs"></i>
            </div>
            <div>
              <p class="font-semibold text-white group-hover:text-emerald-300 transition">Anjali Verma</p>
              <p class="text-[10px] text-gray-400">Teacher Portal</p>
            </div>
          </button>

          <button onclick="fillAndLogin('principal@school.edu', 'principal')" class="persona-card p-3 rounded-xl text-left flex items-center space-x-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-black transition">
              <i class="fa-solid fa-building-columns text-xs"></i>
            </div>
            <div>
              <p class="font-semibold text-white group-hover:text-amber-300 transition">Dr. Rajesh Sharma</p>
              <p class="text-[10px] text-gray-400">Executive Portal</p>
            </div>
          </button>
        </div>
      </div>

    </div>

    <!-- Security Guarantee Badge -->
    <div class="mt-6 text-center text-xs text-gray-400 flex items-center justify-center space-x-2">
      <i class="fa-solid fa-shield-halved text-emerald-400"></i>
      <span>Protected by Cryptographic JWT & Supabase RLS</span>
    </div>

  </div>

  <script>
    const isSingleOrigin = window.location.port === "7860" || window.location.port === "8000" || window.location.hostname.includes("huggingface.co") || window.location.hostname.includes("hf.space") || window.location.port === "";
    const API_BASE = isSingleOrigin ? window.location.origin : "http://localhost:8000";
    
    // Deployment Port Map for Local Dev / Single-Origin Path Map for Hugging Face Spaces
    const PORTAL_ROUTES = {
      "student": isSingleOrigin ? "/student/" : "http://localhost:3001",
      "parent": isSingleOrigin ? "/parent/" : "http://localhost:3002",
      "teacher": isSingleOrigin ? "/staff/" : "http://localhost:3003",
      "principal": isSingleOrigin ? "/management/" : "http://localhost:3004"
    };

    function showStatus(text, isError = false) {
      const box = document.getElementById("statusBox");
      box.className = `mt-4 p-3 rounded-xl text-xs flex items-center space-x-2 ${
        isError ? "bg-rose-950/60 border border-rose-500/50 text-rose-300" : "bg-emerald-950/60 border border-emerald-500/50 text-emerald-300"
      }`;
      box.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${text}</span>`;
      box.classList.remove("hidden");
    }

    async function handleLogin(email, password) {
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        let data;
        try {
          data = await res.json();
        } catch (jsonErr) {
          throw new Error("Received unexpected server response. Please try again.");
        }

        if (!res.ok) {
          throw new Error(data.detail || "Authentication failed");
        }

        // Save verified session token and user profile
        localStorage.setItem("xyz_token", data.access_token);
        localStorage.setItem("xyz_user", JSON.stringify(data.user));

        const role = data.user.role;
        const targetUrl = PORTAL_ROUTES[role] || (isSingleOrigin ? "/parent/" : "http://localhost:3002");
        
        showStatus(`Authenticated as ${data.user.name} (${role.toUpperCase()}). Redirecting...`);
        
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 400);

      } catch (err) {
        showStatus(err.message, true);
        btn.disabled = false;
        btn.innerHTML = `<span>Authenticate & Launch Portal</span><i class="fa-solid fa-arrow-right text-xs ml-2"></i>`;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      handleLogin(email, password);
    });

    function fillAndLogin(email, role) {
      document.getElementById("emailInput").value = email;
      document.getElementById("passwordInput").value = "password123";
      handleLogin(email, "password123");
    }
  </script>
</body>
</html>
